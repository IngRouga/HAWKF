<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>HAWaqf — Haute Autorité du Waqf du Niger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --ink:#17231F; --emerald:#1E4635; --emeraldDark:#12291F;
    --sand:#F6F2E9; --sandDeep:#EDE5D3; --gold:#A9813F; --clay:#B4552A; --line:#DDD3BC;
  }
  html,body{margin:0;background:#fff;}
  body{font-family:'Inter',sans-serif;}
  .font-serif-h{font-family:'Fraunces',serif;}
  @media (prefers-color-scheme: dark) {
    body { background:#fff; color:#17231F; }
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#DDD3BC;border-radius:4px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const COLORS = {
  ink: "#17231F", emerald: "#1E4635", emeraldDark: "#12291F",
  sand: "#F6F2E9", sandDeep: "#EDE5D3", gold: "#A9813F", clay: "#B4552A", line: "#DDD3BC",
};

function I({ name, size = 16, color = "currentColor" }) {
  const s = { width: size, height: size, display: "inline-block", verticalAlign: "middle" };
  const common = { fill: "none", stroke: color, strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "menu": return <svg style={s} viewBox="0 0 24 24" {...common}><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    case "x": return <svg style={s} viewBox="0 0 24 24" {...common}><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>;
    case "chevronRight": return <svg style={s} viewBox="0 0 24 24" {...common}><polyline points="9 6 15 12 9 18"/></svg>;
    case "chevronDown": return <svg style={s} viewBox="0 0 24 24" {...common}><polyline points="6 9 12 15 18 9"/></svg>;
    case "mapPin": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 22s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12z"/><circle cx="12" cy="10" r="2.3"/></svg>;
    case "phone": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v4a2 2 0 0 1-2 2C9.6 21 3 14.4 3 6a2 2 0 0 1 1-2z"/></svg>;
    case "mail": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="5" width="18" height="14" rx="1.5"/><polyline points="3 6 12 13 21 6"/></svg>;
    case "clock": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>;
    case "check": return <svg style={s} viewBox="0 0 24 24" {...common}><polyline points="4 12 9 17 20 6"/></svg>;
    case "send": return <svg style={s} viewBox="0 0 24 24" {...common}><line x1="21" y1="3" x2="10" y2="14"/><polygon points="21 3 14 21 10 14 3 10 21 3"/></svg>;
    case "download": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><line x1="4" y1="20" x2="20" y2="20"/></svg>;
    case "fileText": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M6 3h9l4 4v14H6z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>;
    case "bot": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="4" y="8" width="16" height="11" rx="2.5"/><line x1="12" y1="3" x2="12" y2="8"/><circle cx="12" cy="3" r="1.2" fill={color}/><circle cx="9" cy="13.5" r="1.2" fill={color}/><circle cx="15" cy="13.5" r="1.2" fill={color}/></svg>;
    case "users": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 14.2c2.6.3 4.7 2.6 4.7 5.8"/></svg>;
    case "landmark": return <svg style={s} viewBox="0 0 24 24" {...common}><line x1="4" y1="21" x2="20" y2="21"/><line x1="6" y1="10" x2="6" y2="18"/><line x1="10" y1="10" x2="10" y2="18"/><line x1="14" y1="10" x2="14" y2="18"/><line x1="18" y1="10" x2="18" y2="18"/><polygon points="12 3 21 9 3 9"/></svg>;
    case "droplets": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 3s6 6.4 6 10.5a6 6 0 0 1-12 0C6 9.4 12 3 12 3z"/></svg>;
    case "grad": return <svg style={s} viewBox="0 0 24 24" {...common}><polygon points="12 4 22 9 12 14 2 9 12 4"/><path d="M6 11v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4"/></svg>;
    case "heart": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 21s-7-4.6-9.5-9.2C.9 8.6 2.6 5 6.2 5c2 0 3.4 1 4.8 2.6C12.4 6 13.8 5 15.8 5c3.6 0 5.3 3.6 3.7 6.8C19 16.4 12 21 12 21z"/></svg>;
    case "sprout": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 6-6 0 4-2 6-6 6z"/><path d="M12 13c0-3-2.5-4.5-6-4.5 0 3 2 4.5 6 4.5z"/></svg>;
    case "shield": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>;
    case "chart": return <svg style={s} viewBox="0 0 24 24" {...common}><line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="12" width="3" height="7"/><rect x="11" y="8" width="3" height="11"/><rect x="16" y="4" width="3" height="15"/></svg>;
    case "message": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M4 5h16v11H8l-4 4z"/></svg>;
    case "layout": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>;
    case "folder": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M3 6h6l2 2h10v11H3z"/></svg>;
    case "wallet": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M16 12h3"/><path d="M3 8V6a1 1 0 0 1 1-1h14"/></svg>;
    case "news": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="5" width="14" height="14" rx="1"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/><path d="M17 8h4v9a2 2 0 0 1-2 2h-2"/></svg>;
    case "settings": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.4-2-3.4-2.3.8a7 7 0 0 0-2.7-1.6L13.4 2h-2.8l-.4 2.8a7 7 0 0 0-2.7 1.6l-2.3-.8-2 3.4 2 1.4A7 7 0 0 0 5 12c0 .5 0 1.1.2 1.6l-2 1.4 2 3.4 2.3-.8a7 7 0 0 0 2.7 1.6l.4 2.8h2.8l.4-2.8a7 7 0 0 0 2.7-1.6l2.3.8 2-3.4-2-1.4c.2-.5.2-1.1.2-1.6z"/></svg>;
    case "user": return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>;
    case "facebook": return <svg style={s} viewBox="0 0 24 24" {...common}><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v7h3v-7h3l1-3h-4v-2c0-.6.4-1 1-1z"/></svg>;
    case "linkedin": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="9" width="4" height="11"/><circle cx="5" cy="5" r="1.6"/><path d="M11 9v11"/><path d="M11 13.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5V20"/></svg>;
    case "youtube": return <svg style={s} viewBox="0 0 24 24" {...common}><rect x="3" y="6" width="18" height="12" rx="3"/><polygon points="10 9 16 12 10 15" fill={color} stroke="none"/></svg>;
    default: return <svg style={s} viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="9"/></svg>;
  }
}

function Placeholder({ label, className = "" }) {
  return (
    <div
      className={`flex items-end p-3 text-[11px] tracking-wide w-full h-full ${className}`}
      style={{
        background: "repeating-linear-gradient(135deg, #EDE5D3, #EDE5D3 10px, #E3D8BE 10px, #E3D8BE 20px)",
        color: "#7A6A46", border: "1px solid #DDD3BC",
      }}
    >{label}</div>
  );
}

function Logo({ dark }) {
  const c = dark ? "#F6F2E9" : COLORS.emerald;
  return (
    <div className="flex items-center gap-3">
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
        <path d="M20 3 L36 20 L20 37 L4 20 Z" stroke={c} strokeWidth="1.4" fill="none"/>
        <path d="M20 11 L28 20 L20 29 L12 20 Z" stroke={c} strokeWidth="1.4" fill="none"/>
        <circle cx="20" cy="20" r="2.6" fill={c}/>
      </svg>
      <div style={{ lineHeight: 1.05 }}>
        <div className="font-serif-h text-lg font-semibold tracking-tight" style={{ color: c }}>HAWaqf</div>
        <div className="text-[10.5px] leading-tight" style={{ color: dark ? "#C9C0AC" : "#5C6B62" }}>
          Haute Autorité du Waqf<br/>du Niger
        </div>
      </div>
    </div>
  );
}

const NAV = [
  { id: "accueil", label: "Accueil" },
  { id: "apropos", label: "La HAWaqf" },
  { id: "waqf", label: "Le Waqf" },
  { id: "projets", label: "Nos projets" },
  { id: "actualites", label: "Actualités" },
  { id: "ressources", label: "Ressources" },
  { id: "contact", label: "Contact" },
];

function Header({ page, setPage }) {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const [lang, setLang] = useState("FR");
  const [langNote, setLangNote] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const go = (id) => { setPage(id); setOpen(false); window.scrollTo({ top: 0 }); };

  return (
    <header className="sticky top-0 z-40" style={{
      background: scrolled ? "rgba(246,242,233,0.94)" : "#F6F2E9",
      backdropFilter: "blur(6px)",
      borderBottom: `1px solid ${scrolled ? COLORS.line : "transparent"}`,
    }}>
      <div className="max-w-7xl mx-auto px-5 md:px-8 flex items-center justify-between h-20">
        <button onClick={() => go("accueil")} className="shrink-0"><Logo/></button>
        <nav className="hidden lg:flex items-center gap-7">
          {NAV.map((n) => (
            <button key={n.id} onClick={() => go(n.id)} className="text-[14px]" style={{
              color: page === n.id ? COLORS.emerald : "#5C6B62",
              fontWeight: page === n.id ? 600 : 500,
              borderBottom: page === n.id ? `1.5px solid ${COLORS.gold}` : "1.5px solid transparent",
              paddingBottom: 3,
            }}>{n.label}</button>
          ))}
        </nav>
        <div className="hidden lg:flex items-center gap-4 relative">
          <div className="flex items-center gap-1.5 text-[13px]" style={{ color: "#5C6B62" }}>
            {["FR","EN","AR"].map((l,i) => (
              <React.Fragment key={l}>
                {i>0 && <span style={{ color: COLORS.line }}>|</span>}
                <button onClick={() => { setLang(l); setLangNote(true); setTimeout(()=>setLangNote(false),2600); }}
                  style={{ color: lang===l?COLORS.emerald:"#8A8271", fontWeight: lang===l?700:500 }}>
                  {l === "AR" ? "العربية" : l}
                </button>
              </React.Fragment>
            ))}
          </div>
          {langNote && (
            <div className="absolute top-9 right-0 text-[12px] px-3 py-2 rounded-md shadow-lg whitespace-nowrap"
              style={{ background: COLORS.emeraldDark, color: "#F6F2E9" }}>
              Version {lang} — disponible dans la plateforme finale
            </div>
          )}
          <button onClick={() => go("contribuer")} className="px-5 py-2.5 rounded-md text-[13.5px] font-semibold"
            style={{ background: COLORS.gold, color: "#211705" }}>Faire un Waqf</button>
        </div>
        <button className="lg:hidden" onClick={() => setOpen(!open)}>
          <I name={open?"x":"menu"} size={24} color={COLORS.emerald}/>
        </button>
      </div>
      {open && (
        <div className="lg:hidden px-5 pb-6 flex flex-col gap-1" style={{ background:"#F6F2E9" }}>
          {NAV.map((n) => (
            <button key={n.id} onClick={() => go(n.id)} className="text-left py-3 text-[15px] border-b"
              style={{ borderColor: COLORS.line, color: page===n.id?COLORS.emerald:"#3A4740", fontWeight: page===n.id?700:500 }}>
              {n.label}
            </button>
          ))}
          <button onClick={() => go("contribuer")} className="mt-4 px-5 py-3 rounded-md text-[14px] font-semibold"
            style={{ background: COLORS.gold, color:"#211705" }}>Faire un Waqf</button>
        </div>
      )}
    </header>
  );
}

function Footer({ setPage }) {
  return (
    <footer style={{ background: COLORS.emeraldDark, color:"#D8D2C1" }}>
      <div className="max-w-7xl mx-auto px-5 md:px-8 py-16 grid md:grid-cols-4 gap-10">
        <div>
          <Logo dark/>
          <p className="mt-4 text-[13.5px] leading-relaxed" style={{ color:"#B7AF98" }}>
            Le Waqf au service du développement durable du Niger.
          </p>
          <div className="flex gap-3 mt-5">
            {["facebook","linkedin","youtube"].map((n) => (
              <div key={n} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ border:"1px solid #3A5347" }}>
                <I name={n} size={15} color="#D8D2C1"/>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="text-[13px] font-semibold mb-4 text-white">Institution</div>
          {["apropos","waqf","projets","actualites","ressources","contact"].map((id) => (
            <button key={id} onClick={() => setPage(id)} className="block text-[13.5px] py-1.5 hover:text-white" style={{ color:"#B7AF98" }}>
              {NAV.find(n=>n.id===id)?.label}
            </button>
          ))}
        </div>
        <div>
          <div className="text-[13px] font-semibold mb-4 text-white">Contact</div>
          <p className="text-[13.5px] leading-relaxed" style={{ color:"#B7AF98" }}>
            Plateau, Niamey, Niger<br/>+227 20 00 00 00<br/>contact@hawaqf.ne
          </p>
        </div>
        <div>
          <div className="text-[13px] font-semibold mb-4 text-white">Newsletter</div>
          <p className="text-[13px] mb-3" style={{ color:"#B7AF98" }}>Recevez les actualités du Waqf.</p>
          <div className="flex">
            <input placeholder="Votre email" className="flex-1 px-3 py-2.5 text-[13px] rounded-l-md outline-none"
              style={{ background:"#1B3A2F", color:"#F6F2E9", border:"1px solid #3A5347" }}/>
            <button className="px-3.5 rounded-r-md" style={{ background: COLORS.gold }}>
              <I name="send" size={15} color="#211705"/>
            </button>
          </div>
        </div>
      </div>
      <div className="max-w-7xl mx-auto px-5 md:px-8 py-5 text-[12px] flex justify-between border-t" style={{ borderColor:"#2C463A", color:"#8E8770" }}>
        <span>© {new Date().getFullYear()} Haute Autorité du Waqf du Niger — Prototype</span>
        <span>Données illustratives</span>
      </div>
    </footer>
  );
}

function Stat({ value, label }) {
  return (
    <div className="flex flex-col">
      <span className="font-serif-h text-3xl md:text-4xl font-medium" style={{ color: COLORS.emerald }}>{value}</span>
      <span className="text-[13px] mt-1" style={{ color:"#5C6B62" }}>{label}</span>
      <span className="text-[10.5px] mt-0.5" style={{ color:"#A79B7C" }}>donnée illustrative</span>
    </div>
  );
}

function SectionLabel({ children }) {
  return <div className="text-[13px] font-semibold mb-3" style={{ color: COLORS.gold }}>{children}</div>;
}

const PROJECTS = [
  { id:"cimetiere-bourbourkabe", name:"Cimetière musulman de Bourbourkabé", category:"Infrastructure religieuse", location:"Niamey", goal:45000000, raised:31000000, status:"En cours", icon:"landmark" },
  { id:"education", name:"Projet Éducation", category:"Éducation", location:"Tillabéri", goal:60000000, raised:22000000, status:"En cours", icon:"grad" },
  { id:"sante", name:"Projet Santé", category:"Santé", location:"Maradi", goal:80000000, raised:54000000, status:"En cours", icon:"heart" },
  { id:"eau", name:"Projet Eau et Assainissement", category:"Eau & Assainissement", location:"Zinder", goal:35000000, raised:35000000, status:"Achevé", icon:"droplets" },
  { id:"agriculture", name:"Projet Agriculture", category:"Agriculture", location:"Dosso", goal:50000000, raised:9000000, status:"En cours", icon:"sprout" },
];

function fmt(n){ return n.toLocaleString("fr-FR") + " FCFA"; }

function ProjectCard({ p, setPage, openProject }) {
  const pct = Math.round((p.raised/p.goal)*100);
  return (
    <div className="rounded-lg border overflow-hidden bg-white flex flex-col" style={{ borderColor: COLORS.line }}>
      <div className="h-40 relative">
        <Placeholder label={p.category}/>
        <span className="absolute top-3 left-3 text-[11px] px-2.5 py-1 rounded-full font-medium" style={{
          background: p.status==="Achevé"?"#1E4635":"#FFFFFF",
          color: p.status==="Achevé"?"#F6F2E9":COLORS.emerald,
          border: p.status==="Achevé"?"none":`1px solid ${COLORS.line}`,
        }}>{p.status}</span>
      </div>
      <div className="p-5 flex-1 flex flex-col">
        <div className="flex items-center gap-2 text-[12px] mb-2" style={{ color: COLORS.gold }}>
          <I name={p.icon} size={14}/> {p.category}
        </div>
        <div className="font-serif-h text-[16.5px] font-medium leading-snug" style={{ color: COLORS.ink }}>{p.name}</div>
        <div className="flex items-center gap-1.5 text-[12.5px] mt-1.5" style={{ color:"#5C6B62" }}>
          <I name="mapPin" size={12}/> {p.location}
        </div>
        <div className="mt-4">
          <div className="h-1.5 rounded-full w-full" style={{ background: COLORS.sandDeep }}>
            <div className="h-1.5 rounded-full" style={{ width:`${pct}%`, background: COLORS.emerald }}/>
          </div>
          <div className="flex justify-between mt-2 text-[12px]" style={{ color:"#5C6B62" }}>
            <span>{fmt(p.raised)}</span>
            <span className="font-semibold" style={{ color: COLORS.emerald }}>{pct}%</span>
          </div>
          <div className="text-[11.5px] mt-0.5" style={{ color:"#A79B7C" }}>Objectif : {fmt(p.goal)}</div>
        </div>
        <div className="mt-5 flex gap-2">
          <button onClick={()=>openProject(p.id)} className="flex-1 text-[12.5px] font-semibold py-2.5 rounded-md border"
            style={{ borderColor: COLORS.emerald, color: COLORS.emerald }}>Découvrir le projet</button>
          <button onClick={()=>setPage("contribuer")} className="flex-1 text-[12.5px] font-semibold py-2.5 rounded-md"
            style={{ background: COLORS.gold, color:"#211705" }}>Contribuer</button>
        </div>
      </div>
    </div>
  );
}

function ChatPreview() {
  return (
    <div className="rounded-lg border overflow-hidden shadow-sm" style={{ borderColor: COLORS.line }}>
      <div className="px-5 py-4 flex items-center gap-3" style={{ background: COLORS.emerald }}>
        <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background:"#2C5C46" }}>
          <I name="bot" size={16} color="#F6F2E9"/>
        </div>
        <span className="text-white text-[14px] font-medium">HAWaqf AI</span>
      </div>
      <div className="p-5 space-y-3" style={{ background:"#FFFFFF" }}>
        <div className="text-[13.5px] px-4 py-3 rounded-lg max-w-[85%]" style={{ background: COLORS.sand, color:"#3A4740" }}>
          Bonjour, je suis l'assistant virtuel de la Haute Autorité du Waqf du Niger. Comment puis-je vous aider ?
        </div>
        <div className="flex flex-wrap gap-2 pt-1">
          {["Qu'est-ce que le Waqf ?","Comment créer un Waqf ?","Projets en cours"].map((s) => (
            <span key={s} className="text-[12px] px-3 py-1.5 rounded-full border" style={{ borderColor: COLORS.line, color: COLORS.emerald }}>{s}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

function HomePage({ setPage, openProject }) {
  return (
    <React.Fragment>

                <button key={a} onClick={()=>{setAmount(a);setCustom("");}} className="py-3.5 rounded-md border text-[14px] font-semibold"

        {step===5 && (
          <div className="space-y-2.5">
            {["Mobile Money","Carte bancaire","Virement bancaire","Autres moyens"].map((m) => (

        )}
        <div className="flex justify-between mt-8">
          <button onClick={()=>setStep(Math.max(1,step-1))} className="px-5 py-2.5 rounded-md text-[13.5px] font-medium"
            style={{ color:"#5C6B62", visibility: step===1?"hidden":"visible" }}>Précédent</button>

            {step===5 ? "Confirmer la contribution" : "Continuer"}
          </button>
        </div>
      </div>
    </div>

function AIPage() {
  const [msgs, setMsgs] = useState([
    { role:"bot", text:"Bonjour, je suis l'assistant virtuel de la Haute Autorité du Waqf du Niger. Comment puis-je vous aider ?" },
  ]);
  const [input, setInput] = useState("");
  const suggestions = ["Qu'est-ce que le Waqf ?","Comment créer un Waqf ?","Quels sont les projets en cours ?","Comment contribuer ?","Quels documents dois-je fournir ?"];
  const send = (text) => {
    if (!text.trim()) return;
    setMsgs((m) => [...m, { role:"user", text }, { role:"bot", text:"Ceci est un prototype : HAWaqf AI n'est pas encore connectée à une base documentaire réelle. Dans la version finale, l'agent répondra à partir des textes officiels de la HAWaqf." }]);
    setInput("");
  };
  return (
    <div className="max-w-3xl mx-auto px-5 py-14">
      <SectionLabel>HAWaqf AI</SectionLabel>
      <h1 className="font-serif-h text-3xl font-medium mb-2" style={{ color: COLORS.ink }}>Votre assistant HAWaqf</h1>
      <p className="text-[14px] mb-8" style={{ color:"#5C6B62" }}>Une nouvelle façon d'accéder à l'information sur le Waqf.</p>
      <div className="rounded-lg border overflow-hidden" style={{ borderColor: COLORS.line }}>
        <div className="h-96 overflow-y-auto p-5 space-y-3" style={{ background:"#FFFFFF" }}>
          {msgs.map((m,i) => (
            <div key={i} className={`flex ${m.role==="user"?"justify-end":"justify-start"}`}>
              <div className="max-w-[80%] text-[13.5px] px-4 py-3 rounded-lg leading-relaxed"
                style={{ background: m.role==="user"?COLORS.emerald:COLORS.sand, color: m.role==="user"?"#F6F2E9":"#3A4740" }}>
                {m.text}
              </div>
            </div>
          ))}
        </div>
        <div className="p-4 border-t flex flex-wrap gap-2" style={{ borderColor: COLORS.line }}>
          {suggestions.map((s) => (
            <button key={s} onClick={()=>send(s)} className="text-[12px] px-3 py-1.5 rounded-full border" style={{ borderColor: COLORS.line, color: COLORS.emerald }}>{s}</button>
          ))}
        </div>
        <div className="p-4 border-t flex gap-2" style={{ borderColor: COLORS.line }}>
          <input value={input} onChange={(e)=>setInput(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&send(input)}
            placeholder="Écrivez votre question…" className="flex-1 px-4 py-3 rounded-md border text-[14px] outline-none" style={{ borderColor: COLORS.line }}/>
          <button onClick={()=>send(input)} className="px-4 rounded-md" style={{ background: COLORS.emerald }}>
            <I name="send" size={16} color="#F6F2E9"/>
          </button>
        </div>
      </div>
    </div>
  );
}

function FAQPage() {

            <button onClick={()=>setOpen(open===i?-1:i)} className="w-full flex items-center justify-between py-5 text-left">
              <span className="text-[15px] font-medium" style={{ color: COLORS.ink }}>{q}</span>
              <span style={{ transform: open===i?"rotate(180deg)":"none", transition:"transform 0.2s" }}>

}

                </div>
              ))}

            <div className="h-56 rounded-lg border"><Placeholder label="Graphique — évolution des contributions"/></div>
          </React.Fragment>

  );

function App() {
  const [page, setPage] = useState("accueil");
  const [projectId, setProjectId] = useState(PROJECTS[0].id);
  const openProject = (id) => { setProjectId(id); setPage("projet-detail"); };
  const pages = {
    accueil: <HomePage setPage={setPage} openProject={openProject}/>,
    apropos: <AboutPage/>,
    waqf: <WaqfPage setPage={setPage}/>,
    projets: <ProjectsPage setPage={setPage} openProject={openProject}/>,
    "projet-detail": <ProjectDetailPage projectId={projectId} setPage={setPage}/>,
    contribuer: <ContributionPage setPage={setPage}/>,
    ai: <AIPage/>,
    actualites: <NewsPage/>,
    ressources: <ResourcesPage/>,
    faq: <FAQPage/>,
    contact: <ContactPage/>,
    admin: <AdminPage/>,
  };
  return (
    <div style={{ background:"#FFFFFF" }} className="min-h-screen">
      <Header page={page} setPage={setPage}/>
      {pages[page] || pages.accueil}
      <div className="text-center py-3" style={{ background: COLORS.sand }}>
        <button onClick={()=>setPage("admin")} className="text-[11.5px]" style={{ color:"#A79B7C" }}>Accès administration (démo)</button>
        <span className="mx-2" style={{ color: COLORS.line }}>·</span>
        <button onClick={()=>setPage("faq")} className="text-[11.5px]" style={{ color:"#A79B7C" }}>FAQ</button>
      </div>
      <Footer setPage={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
